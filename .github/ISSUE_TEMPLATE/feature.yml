name: Feature Request
description: Propose a new feature, adapter, or tool for SemantIQ Behavioral Evidence Infrastructure.
title: "[Feature]: "
labels: ["enhancement", "needs-triage"]
body:
  - type: input
    id: feature_title
    attributes:
      label: Feature Title
      placeholder: "e.g., Support CSV Trace Ingestion in Python CLI"
    validations:
      required: true
  - type: dropdown
    id: domain
    attributes:
      label: Target Domain
      options:
        - "Core Architecture"
        - "Benchmark Engine"
        - "Evidence Engine"
        - "Research Governance"
        - "Python SDK"
        - "TypeScript SDK"
        - "CLI / HTTP API"
        - "Documentation"
    validations:
      required: true
  - type: textarea
    id: user_story
    attributes:
      label: User Story & Value Proposition
      description: As a researcher/engineer, I want [goal] so that [benefit].
    validations:
      required: true
  - type: textarea
    id: acceptance_criteria
    attributes:
      label: Acceptance Criteria & Tests
      description: What specific automated tests or behavioral verifications will confirm this feature is complete?
    validations:
      required: true
