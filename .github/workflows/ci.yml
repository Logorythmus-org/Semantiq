name: CI

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  core-quality-gates:
    name: Core Lint, Typecheck, Boundaries & Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
        with:
          version: 11.7.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Validate Changesets Package Graph
        run: pnpm changeset status --since origin/main
      - name: Prettier format check
        run: pnpm format:check
      - name: ESLint
        run: pnpm lint
      - name: TypeScript Typecheck
        run: pnpm typecheck
      - name: Package Boundaries & Architecture Rules
        run: pnpm test:boundaries
      - name: Build all workspace packages
        run: pnpm build

  python-package-gates:
    name: Python SDK, Build & Tests (Py ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install Python build frontend
        run: |
          python -m pip install --upgrade pip
          python -m pip install build
      - name: Install SemantIQ Python package with declared test tools
        run: python -m pip install -e "./packages/python[dev]"
      - name: Run full Python pytest suite
        run: python -m pytest packages/python/tests/
      - name: Test Python package build (Wheel & Sdist)
        run: python -m build packages/python

  typescript-sdk-gates:
    name: TypeScript SDK Build & Contract Battery
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.7.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Validate TypeScript SDK Compatibility
        run: pnpm test:sdk
      - name: Test Reference Vertical Slice Pipeline
        run: pnpm vitest run tests/unit/reference-workflow-vertical-slice.test.ts

  cross-language-contracts-parity:
    name: Cross-Language Schema & Contract Parity
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.7.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Validate Product Contracts
        run: pnpm test:contracts:product
      - name: Validate Shared Contract Schemas
        run: pnpm vitest run tests/contracts/shared-contracts.test.ts

  documentation-quality-gate:
    name: Docs Build & Link Validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.7.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Build Static Documentation Site
        run: node scripts/build-docs.mjs
      - name: Validate Public Documentation Links & Identity
        run: pnpm docs:validate
      - name: Verify Documentation Validation Tests
        run: pnpm vitest run tests/unit/documentation-validation.test.ts

  security-boundary-gate:
    name: Security Boundaries & Secret Redaction
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.7.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Run Security Test Suite
        run: pnpm test:security
      - name: Run Security Boundary & Credential Tests
        run: pnpm vitest run tests/unit/security-boundary.test.ts tests/unit/credential-boundary.test.ts

  benchmark-regression-gate:
    name: Benchmark & Full Node Regression
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.7.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: First-Run Doctor
        run: pnpm doctor
      - name: Preflight Check
        run: pnpm preflight
      - name: Model Connector Check
        run: pnpm connector
      - name: Deterministic Smoke Evaluation
        run: pnpm smoke
      - name: Build Static Documentation Site
        run: node scripts/build-docs.mjs
      - name: Full Test Suite Regression (199 Test Files)
        run: pnpm test

  web-ui-optional:
    name: Web UI Build (Non-Core Optional Client)
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.7.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Build Web Client
        run: pnpm --filter @tech-club/web-app build
