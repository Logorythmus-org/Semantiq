name: Experimental Cognitive Runtime
on:
  pull_request:
    paths:
      - 'experimental/cognitive-runtime/**'
      - '.github/workflows/cognitive-runtime.yml'
jobs:
  offline-contracts:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.10', '3.11', '3.12']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Run offline contract and adapter regressions
        working-directory: experimental/cognitive-runtime
        run: python -m unittest discover -s tests -v
      - name: Replay archived labels without regeneration
        working-directory: experimental/cognitive-runtime
        run: python validate_frozen.py
