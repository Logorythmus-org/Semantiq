name: Generate security dependency lockfile candidate

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  generate-lockfile:
    if: github.head_ref == 'security/dependabot-alert-remediation-20261113' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.11.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Generate lockfile without package lifecycle scripts
        run: pnpm install --lockfile-only --ignore-scripts --no-frozen-lockfile
      - name: Upload proposed lockfile
        uses: actions/upload-artifact@v4
        with:
          name: security-lockfile-candidate
          path: pnpm-lock.yaml
          retention-days: 1
      - name: Emit public lockfile text for connector-only recovery
        shell: bash
        run: |
          node - <<'NODE'
          const fs = require('node:fs');
          const encoded = fs.readFileSync('pnpm-lock.yaml').toString('base64');
          console.log('BEGIN_SEMANTIQ_SECURITY_LOCKFILE_B64');
          for (let i = 0; i < encoded.length; i += 1000) {
            console.log('LOCKFILE_CHUNK:' + encoded.slice(i, i + 1000));
          }
          console.log('END_SEMANTIQ_SECURITY_LOCKFILE_B64');
          NODE
