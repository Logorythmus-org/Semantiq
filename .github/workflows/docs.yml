name: Documentation Site

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  build-docs:
    name: Build & Verify Documentation Site
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Build Static Documentation Site
        run: node scripts/build-docs.mjs
      - name: Validate Public Documentation Links & Identity
        run: node scripts/validate-public-docs.mjs
      - name: Verify Generated Documentation Artifacts
        run: |
          test -f dist/docs/index.html
          test -f dist/docs/getting-started/index.html
          test -f dist/docs/architecture/index.html
          test -f dist/docs/evidence/index.html
          test -f dist/docs/research/index.html
          test -f dist/docs/sdk/index.html
          test -f dist/docs/api/index.html
          test -f dist/docs/security/index.html
          test -f dist/docs/governance/index.html
          test -f dist/docs/releases/index.html
