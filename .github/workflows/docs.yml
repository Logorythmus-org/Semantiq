name: Docs

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify Canonical Documentation Files
        run: |
          test -f README.md
          test -f docs/README.md
          test -f docs/getting-started/index.md
          test -f docs/getting-started/installation.md
          test -f docs/concepts/architecture.md
          test -f docs/project/limitations.md
