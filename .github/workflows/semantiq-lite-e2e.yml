name: SemantIQ Lite Real-SDK Smoke

on:
  pull_request:
    paths:
      - "plugins/semantiq-lite/**"
      - "packages/python/tests/test_semantiq_lite_integration.py"
      - ".github/workflows/semantiq-lite-e2e.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  offline-sdk-smoke:
    name: Python ${{ matrix.python-version }} SDK + skill
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install actual SemantIQ SDK from checked-out source
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ./packages/python -e ./plugins/semantiq-lite pytest ruff mypy build
          python -c 'import semantiq; print("Real SDK installed:", semantiq.__version__, semantiq.__file__)'
      - name: Run independent unit and SDK-installed end-to-end tests
        run: |
          python -m unittest discover -s plugins/semantiq-lite/tests -v
          python -m pytest -q packages/python/tests/test_semantiq_lite_integration.py
          python -m ruff check plugins/semantiq-lite/src plugins/semantiq-lite/tests plugins/semantiq-lite/contracts/build_schema.py plugins/semantiq-lite/examples/build_examples.py
          python -m mypy --ignore-missing-imports plugins/semantiq-lite/src
          python -m build plugins/semantiq-lite --outdir /tmp/semantiq-lite-dist
          python -m venv /tmp/semantiq-lite-wheel
          /tmp/semantiq-lite-wheel/bin/python -m pip install /tmp/semantiq-lite-dist/*.whl
          cd /tmp
          /tmp/semantiq-lite-wheel/bin/python -c 'from semantiq_lite import snapshot, ReviewResult, validate_review; validate_review(ReviewResult([snapshot("s", b"ok")]), {"s": b"ok"})'
      - name: Install the skill into isolated CODEX_HOME and invoke it
        env:
          CODEX_HOME: ${{ runner.temp }}/codex-home
        run: |
          mkdir -p "$CODEX_HOME/skills"
          cp -R plugins/semantiq-lite/skills/semantiq-lite "$CODEX_HOME/skills/semantiq-lite"
          test -f "$CODEX_HOME/skills/semantiq-lite/SKILL.md"
          python "$CODEX_HOME/skills/semantiq-lite/scripts/semantiq_lite.py" short-report \
            --text "Our study observed an association." --source "unverified-test-1" --json
      - name: Emit a real SDK-backed short report
        run: |
          python plugins/semantiq-lite/skills/semantiq-lite/scripts/semantiq_lite.py short-report \
            --text "Our evaluation proves the new agent guarantees safe execution." \
            --source "unverified-paper-1" --json
