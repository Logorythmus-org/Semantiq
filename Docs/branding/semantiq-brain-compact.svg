<title id="brand-title">SemantIQ — original ASCII brain and wordmark in approved rose and mauve palette</title>
<desc id="brand-desc">The unchanged compact Unicode brain made of shaded blocks sits above the original eight-line block-character SemantIQ title, both in coral, dusty rose, mauve and muted blue-gray colors.</desc>
