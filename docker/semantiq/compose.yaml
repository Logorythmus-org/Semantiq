name: semantiq-local

services:
  api:
    build:
      context: ../..
      dockerfile: docker/semantiq/Dockerfile
    image: semantiq:local-evaluation
    init: true
    restart: "no"
    ports:
      - "127.0.0.1:8080:8080"
    environment:
      SEMANTIQ_HOST: 0.0.0.0
      SEMANTIQ_PORT: "8080"
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:8080/health').then(r => { if (!r.ok) process.exit(1); }).catch(() => process.exit(1));"
      interval: 10s
      timeout: 3s
      retries: 12
      start_period: 20s
