[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "semantiq-lite"
version = "0.2.0"
description = "Experimental offline evidence integrity contracts"
requires-python = ">=3.10"
dependencies = ["jsonschema>=4.18,<5"]

[tool.hatch.build.targets.wheel]
packages = ["src/semantiq_lite"]
