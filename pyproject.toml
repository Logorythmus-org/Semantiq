[tool.ruff]
line-length = 100
target-version = "py312"
exclude = ["node_modules", "dist", ".venv"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.pytest.ini_options]
testpaths = ["packages/python/tests", "tests", "services"]
python_files = ["test_*.py", "*_test.py"]
pythonpath = ["packages/python/src"]
addopts = "-ra"
